about_text: |
  hey there, welcome to my website

  a bit about me...

  i make music, mess around with audio engineering, and occasionally dj around nyc. this is what i would do all day if i won the lottery.

  i have been addicted to claude code. i have just been building and building and seeing what is possible. sometimes what i've made has been cool!

  when i need to unplug i'm usually traveling somewhere new or hiding out in maine with a good book.

  work-wise, i'm a data person. i like helping businesses figure out what actually matters. building metrics and products that help with decision-making and that people want to actually look at.

  im currently going deep on crypto in my current role, working to refactor a multi trillion record blockchain data operation to allow for greater impact and insight.

