<!doctype html>
<!--
  Source for site/public/og-image.png (1200x630), the link-preview card every
  page points og:image and twitter:image at, but Claudlobby's, which has its
  own (claudlobby-card.html). Keep the text in step with
  seo.image.alt in site/site.yaml, then re-render from frontend/:
  node scripts/og-image/render.mjs
  Colours are palette.ts shades: slate 950/300/400, primary 600, accent 600.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background:
          radial-gradient(640px 420px at 100% 0%, rgb(37 99 235 / 0.34), transparent 70%),
          radial-gradient(560px 380px at 0% 100%, rgb(124 58 237 / 0.26), transparent 70%),
          #020617;
        color: #f8fafc;
        font-family: Inter, -apple-system, "SF Pro Display", system-ui, sans-serif;
        padding: 72px 80px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto 1fr auto;
        column-gap: 64px;
      }
      .brand {
        grid-column: 1 / -1;
        font-size: 30px;
        font-weight: 700;
        color: #cbd5e1;
      }
      .words {
        align-self: center;
      }
      h1 {
        font-size: 84px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      .sub {
        margin-top: 28px;
        font-size: 36px;
        line-height: 1.35;
        color: #cbd5e1;
      }
      .photo {
        align-self: center;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        object-fit: cover;
        object-position: top;
        border: 2px solid rgb(203 213 225 / 0.35);
      }
      .foot {
        grid-column: 1 / -1;
        font-size: 26px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="brand">Chris Rogers</div>
    <div class="words">
      <h1>i build things that build things.</h1>
      <p class="sub">data, agent fleets and music.</p>
    </div>
    <img class="photo" src="public/profile-photos/photo-2-480.webp" alt="" />
    <div class="foot">crog.gg</div>
  </body>
</html>
