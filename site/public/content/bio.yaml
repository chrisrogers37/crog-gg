about_text: |
  i make music, mess around with audio engineering, and occasionally DJ around NYC.

  nowadays, though, i spend most of my time building with AI. i'm especially interested in agent teams that can build applications and improve how they work.

  when i need to unplug, i'm usually traveling somewhere new or hiding out in Maine with a good book.

  work-wise, i'm a data person. i like helping businesses drive value by pushing data all the way up to the point of decision. currently i'm the data lead at Artemis: trillion row blockchain pipelines, equities and SEC filings, and whatever alternate sources we can get our hands on, all to help investors decide what's real.

  anyways, smash the SUMMON NEW LORE button to run up my OpenAI costs and have some fun. cheers.
