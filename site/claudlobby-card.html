<!doctype html>
<!--
  Source for site/public/claudlobby-card.png (1200x630), the link-preview card
  of Claudlobby's page (/projects/claudlobby), in Claudfather's colours
  (palette.ts claudfather: charcoal, cream, orange). Keep the words in step
  with card.alt in site/public/content/projects/claudlobby.yaml, then re-render
  from frontend/: node scripts/og-image/render.mjs
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        /* The avatar's night: charcoal under a rain of faint dots. */
        background-color: #262627;
        background-image: radial-gradient(rgb(250 237 212 / 0.09) 1.5px, transparent 2px);
        background-size: 18px 18px;
        color: #faedd4;
        font-family: Inter, -apple-system, "SF Pro Display", system-ui, sans-serif;
        padding: 72px 80px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto 1fr auto;
        column-gap: 56px;
      }
      .brand {
        font-size: 30px;
        font-weight: 700;
        color: #e5711f;
      }
      .words {
        align-self: center;
      }
      h1,
      .sub {
        text-wrap: balance;
      }
      h1 {
        font-size: 84px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      .sub {
        margin-top: 28px;
        font-size: 34px;
        line-height: 1.35;
        color: rgb(250 237 212 / 0.82);
      }
      .mark {
        grid-column: 2;
        grid-row: 1 / -1;
        align-self: center;
        width: 400px;
        height: 400px;
        border-radius: 50%;
      }
      .foot {
        font-size: 24px;
        color: rgb(250 237 212 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="brand">Claudlobby</div>
    <div class="words">
      <h1>Build a dark factory.</h1>
      <p class="sub">An open-source agent fleet: manager, engineer and reviewer agents that work 24/7.</p>
    </div>
    <img class="mark" src="public/profile-photos/claudfather-480.webp" alt="" />
    <div class="foot">github.com/Claudfather/Claudlobby</div>
  </body>
</html>
