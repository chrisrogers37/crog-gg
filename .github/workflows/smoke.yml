name: Post-deploy smoke

# Vercel reports every deployment to GitHub. When one succeeds, check that the
# deployed site actually serves: the home page, a deep link, YAML content as
# YAML, the CSP header, real 404s and the API's health check (#195).
#
# Deployment URLs (*.vercel.app) sit behind Vercel's login, so a run needs:
#   - the VERCEL_AUTOMATION_BYPASS_SECRET Actions secret (Vercel: Deployment
#     Protection, Protection Bypass for Automation). With it, every run checks
#     the deployment that triggered it, previews included; or
#   - the SITE_URL Actions variable (the public production URL), which lets
#     Production deployments be checked without the secret.
# Eligibility records why a deployment can or cannot be tested. The Smoke job
# is skipped when no safe target is available. Production in this repo with
# neither setting fails eligibility, so it cannot silently go unchecked.
#
# Security: authorizing a fork's preview in Vercel (Git Fork Protection) runs
# the fork's code with the Preview environment variables, and, because a
# deployment_status run uses the deployed commit's workflow files, the fork's
# workflows here with any permissions they declare and every Actions secret.
# `contents: read` below limits only this file. Review the whole fork PR before
# authorizing its deployment. This check itself sends the bypass secret only to
# a commit that is the head of a branch in this repo, never to a fork's preview,
# whose code could log the header.
on: deployment_status

permissions:
  contents: read

jobs:
  eligibility:
    name: Smoke eligibility
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_smoke: ${{ steps.target.outputs.run_smoke }}
      base: ${{ steps.target.outputs.base }}
      use_bypass: ${{ steps.target.outputs.use_bypass }}
    env:
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.event.deployment.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
    steps:
      - name: Choose a safe smoke-test target
        id: target
        run: |
          set -euo pipefail
          echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          echo "use_bypass=false" >> "$GITHUB_OUTPUT"
          # True when the deployed commit is the head of a branch in this repo,
          # i.e. not a fork's commit, so it's safe to send the bypass header.
          own_branch_head() {
            local reply code
            reply=$(curl -sS --max-time 20 -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/commits/$SHA/branches-where-head")
            code="${reply##*$'\n'}"
            if [ "$code" != 200 ]; then
              echo "::warning::Couldn't check whether $SHA is a branch head here (GitHub API HTTP $code), so the bypass secret isn't sent."
              return 1
            fi
            grep -q '"name"' <<<"${reply%$'\n'*}"
          }
          if [ "$HAS_BYPASS" = true ] && own_branch_head; then
            BASE="${DEPLOYMENT_URL%/}"
            echo "use_bypass=true" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "Production" ] && [ -n "$SITE_URL" ]; then
            BASE="${SITE_URL%/}"
          elif [ "$ENVIRONMENT" = "Production" ] && [ "$REPOSITORY" = "chrisrogers37/crog-gg" ]; then
            reason="Production can't be checked: set the SITE_URL variable or the VERCEL_AUTOMATION_BYPASS_SECRET secret."
            echo "::error::$reason"
            echo "Smoke did not run. $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$HAS_BYPASS" = true ]; then
            reason="The deployed commit could not be verified as a current branch head in this repository. The bypass secret is not sent to fork previews or branches that have moved on."
            echo "::notice::Smoke skipped. $reason"
            echo "Smoke was skipped; no deployment checks ran. $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            reason="No automation bypass secret is configured. Previews need VERCEL_AUTOMATION_BYPASS_SECRET; production can use SITE_URL instead."
            echo "::notice::Smoke skipped. $reason"
            echo "Smoke was skipped; no deployment checks ran. $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          echo "Smoke is eligible to check $ENVIRONMENT at $BASE. See the separate Smoke job for its result." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke
    needs: eligibility
    if: needs.eligibility.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.event.deployment.sha }}
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ needs.eligibility.outputs.base }}
      # The public-production fallback never receives the bypass secret.
      BYPASS: ${{ needs.eligibility.outputs.use_bypass == 'true' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
    steps:
      - name: Smoke-test the deployment
        run: |
          # Run every deployed check even if an earlier one fails.
          set +e -uo pipefail
          # A queued job may start after a branch moves. Recheck immediately
          # before sending the secret, and fail closed if eligibility changed.
          if [ -n "$BYPASS" ]; then
            reply=$(curl -sS --max-time 20 -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/commits/$SHA/branches-where-head")
            code="${reply##*$'\n'}"
            if [ "$code" != 200 ] || ! grep -q '"name"' <<<"${reply%$'\n'*}"; then
              echo "::error::The deployed commit is no longer a verified branch head here. No deployment requests were sent."
              echo "Smoke stopped before checking the deployment: branch-head verification failed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "Checking $ENVIRONMENT at $BASE"

          c() { curl -sS --max-time 20 ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} "$@"; }
          st() { c -o /dev/null -w '%{http_code}' "$BASE$1"; }
          fail=0
          pass() { echo "ok    $1"; }
          flunk() { echo "FAIL  $1"; fail=1; }
          expect() { if [ "$2" = "$3" ]; then pass "$1"; else flunk "$1: got $2, want $3"; fi; }

          expect "/ returns 200" "$(st /)" 200
          if c -I "$BASE/" | grep -qi '^content-security-policy:'; then pass "/ sends a CSP header"; else flunk "/ sends no CSP header"; fi

          file=$(c "$BASE/content/projects/index.yaml" | grep -m1 -oE '[A-Za-z0-9._-]+\.yaml$')
          slug=$(c "$BASE/content/projects/$file" | awk '/^id:/ {print $2; exit}')
          if [ -n "$slug" ]; then
            expect "a project deep link (/projects/$slug) returns 200" "$(st "/projects/$slug")" 200
          else
            flunk "no project id found via /content/projects/index.yaml"
          fi

          expect "/content/bio.yaml returns 200" "$(st /content/bio.yaml)" 200
          type=$(c -o /dev/null -w '%{content_type}' "$BASE/content/bio.yaml")
          case "$type" in
            *text/html*) flunk "/content/bio.yaml is served as HTML ($type)" ;;
            *) pass "/content/bio.yaml is served as $type" ;;
          esac

          expect "an unknown path returns 404" "$(st /smoke-no-such-page)" 404

          # A preview without keys may answer 503; the JSON body still proves
          # the function imported. Production must be healthy.
          code=$(c -o health.json -w '%{http_code}' "$BASE/api/health")
          if grep -q '"checks"' health.json; then pass "/api/health answers JSON ($code)"; else flunk "/api/health didn't answer JSON ($code)"; fi
          if [ "$ENVIRONMENT" = "Production" ]; then expect "/api/health is 200 on production" "$code" 200; fi

          exit $fail
