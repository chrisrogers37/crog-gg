name: Phone pass audit

# One-off, never merged. Job `audit` builds the branch's frontend and main's, serves both the same way with the API's
# answers fixed, and records overflow, type size and axe at three phone widths, the pressed state, WebKit's iPhone
# profiles with and without simulated insets, a pixel compare at 1440 and before and after shots; Lighthouse on
# production, main and the branch; and runs the phone spec against main to show that it fails there. Job `simulator`
# loads the branch's build in the iOS Simulator. Each uploads what it recorded. Runs only on this branch.
on:
  push:
    branches: [scratch/phone-pass-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OUT: ${{ github.workspace }}/out
      PR: http://localhost:4180
      MAIN: http://localhost:4181
      PR_ROOT: ${{ github.workspace }}/pr
    steps:
      # The branch's frontend is the pull request's to the byte: the audit's own commit touches only .github/.
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          path: pr
          persist-credentials: false

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: pr/.nvmrc

      - name: Note the commits
        run: |
          mkdir -p out
          echo "PR_SHA=$(git -C pr rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git -C main rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the branch's frontend
        id: build_pr
        working-directory: pr/frontend
        run: |
          npm ci
          npm run build

      - name: Build main's frontend
        id: build_main
        working-directory: main/frontend
        run: |
          npm ci
          npm run build

      - name: Install the audit's tools
        id: tools
        working-directory: pr/.github/design-audit
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.58.2 axe-core@4.10.0 pixelmatch@5.3.0 pngjs@7.0.0 lighthouse@13.5.0

      # The browsers land in the shared cache, which main's own @playwright/test (the same version) reads below.
      - name: Install Chromium and WebKit with their system packages
        id: deps
        continue-on-error: true
        timeout-minutes: 8
        working-directory: pr/.github/design-audit
        run: npx playwright install --with-deps chromium webkit

      - name: Install Chromium and WebKit alone
        if: steps.deps.outcome != 'success'
        working-directory: pr/.github/design-audit
        run: npx playwright install chromium webkit

      - name: Serve both builds the same way
        id: serve
        run: |
          nohup node pr/.github/design-audit/serve.mjs pr/frontend/dist 4180 > out/serve-pr.log 2>&1 &
          nohup node pr/.github/design-audit/serve.mjs main/frontend/dist 4181 > out/serve-main.log 2>&1 &
          for port in 4180 4181; do
            for attempt in $(seq 1 90); do
              curl -fsS "http://localhost:$port/" > /dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS "http://localhost:$port/api/features" || { cat out/serve-pr.log out/serve-main.log; exit 1; }
            echo
          done

      # The checks write their rows into out/report.md and out/report.json before any gate decides; the steps below run
      # whichever way an earlier one went, so one run holds all the evidence, and the upload runs last.
      - name: Audit the branch's build
        id: audit
        timeout-minutes: 30
        working-directory: pr/.github/design-audit
        run: node audit.mjs

      - name: Lighthouse on production, main and the branch
        id: lighthouse
        if: ${{ !cancelled() && steps.serve.outcome == 'success' && steps.tools.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: pr/.github/design-audit
        run: node lighthouse.mjs

      # Prove the spec bites: the phone spec and the config's one change run against main, where it has to fail.
      - name: Copy the phone spec and the config into main's checkout
        id: bite_copy
        if: ${{ !cancelled() && steps.build_main.outcome == 'success' }}
        run: |
          cp pr/frontend/e2e/phone.spec.ts main/frontend/e2e/phone.spec.ts
          cp pr/frontend/playwright.config.ts main/frontend/playwright.config.ts

      # The config starts main's dev server and a preview of its build itself. The expected failures must not end the step.
      - name: Run the phone spec against main
        if: ${{ !cancelled() && steps.bite_copy.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: main/frontend
        run: npx playwright test e2e/phone.spec.ts --project=chromium --project=webkit --reporter=json > ../../out/bite.json || true

      - name: Check that the tests that must fail on main did
        if: ${{ !cancelled() && steps.bite_copy.outcome == 'success' }}
        working-directory: pr/.github/design-audit
        run: node bite.mjs

      - name: Upload what the audit recorded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-pass-audit
          path: out
          retention-days: 7
          if-no-files-found: error

  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SIM_OUT: ${{ github.workspace }}/sim-out
      SITE: http://localhost:4180
      WEBDRIVER: http://127.0.0.1:4444
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The Simulator serves nothing: it loads the build served here, by the audit job's server and with its API answers.
      - name: Serve the build
        run: |
          mkdir -p "$SIM_OUT"
          nohup node .github/design-audit/serve.mjs frontend/dist 4180 > "$SIM_OUT/serve.log" 2>&1 &
          for attempt in $(seq 1 90); do
            curl -fsS http://localhost:4180/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:4180/api/features || { cat "$SIM_OUT/serve.log"; exit 1; }
          echo

      - name: Pick, boot and tidy a device
        id: boot
        timeout-minutes: 15
        run: node .github/design-audit/simulator.mjs boot

      # Ladder A needs safaridriver. If it is refused, or will not give a session, the portrait step falls to ladder B.
      - name: Start Safari's WebDriver
        continue-on-error: true
        run: |
          sudo safaridriver --enable || echo "safaridriver --enable failed"
          nohup safaridriver -p 4444 > "$SIM_OUT/safaridriver.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4444/status > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sS http://127.0.0.1:4444/status || true

      - name: Shoot in portrait
        id: portrait
        timeout-minutes: 20
        run: node .github/design-audit/simulator.mjs portrait

      # UI scripting needs Accessibility access the runner may not grant; the landscape step checks whether it worked.
      - name: Rotate the Simulator
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        continue-on-error: true
        run: |
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 8
          osascript -e 'tell application "Simulator" to activate' -e 'tell application "System Events" to keystroke (ASCII character 28) using command down'
          sleep 3

      - name: Shoot in landscape
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        timeout-minutes: 15
        run: node .github/design-audit/simulator.mjs landscape

      - name: Write the summary
        if: always()
        run: node .github/design-audit/simulator.mjs summary

      - name: Upload the Simulator shots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-pass-simulator
          path: |
            sim-out/sim-*.png
            sim-out/summary.md
            sim-out/state.json
            sim-out/*.log
          retention-days: 7
          if-no-files-found: error
