name: Bug
description: Something on crog.gg, or in this repo, doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Found a security problem? Please report it privately instead; see SECURITY.md.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or endpoint, e.g. https://www.crog.gg/about or /api/regenerate.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and device
